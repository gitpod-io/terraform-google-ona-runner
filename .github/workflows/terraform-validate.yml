name: Terraform Validate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.16.2"
        terraform_wrapper: false

    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      
    - name: Terraform Init
      run: terraform init -backend=false
      
    - name: Terraform Validate
      run: terraform validate
      
    - name: Test private runner configuration
      run: terraform test -filter=tests/internal-runner.tftest.hcl

    - name: Test internal TLS lifecycle without cloud credentials
      run: |
        python3 tests/test_internal_runner_tls.py
        internal_tls_google_version=$(terraform version -json | python3 -c 'import json, sys; print(json.load(sys.stdin)["provider_selections"]["registry.terraform.io/hashicorp/google"])')
        if [ "$internal_tls_google_version" != "7.6.0" ]; then
          python3 tests/test_internal_runner_tls.py --google-provider-version "$internal_tls_google_version"
        fi

    - name: Validate Examples
      run: |
        for example_dir in examples/*/; do
          if [ -d "$example_dir" ] && [ -f "$example_dir/main.tf" ]; then
            echo "Validating example: $example_dir"
            cd "$example_dir"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          fi
        done
        
        # Validate example modules
        for module_dir in examples/*/modules/*/; do
          if [ -d "$module_dir" ] && [ -f "$module_dir/main.tf" ]; then
            echo "Validating example module: $module_dir"
            cd "$module_dir"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          fi
        done
